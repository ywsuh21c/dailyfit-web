# SEO 불변식 가드 — 색인 보류가 다시 조용히 생기는 것을 막는다.
#
# 왜 스케줄인가:
#   8/6 실사고(활동 상세 10,282장이 404 인 my. 를 정본으로 선언)는 배포 직후가
#   아니라 **아무 배포 없이도** 다시 생길 수 있다 — my. 쪽 배포, 백엔드
#   public-index 응답, DNS·인증서, robots 어느 하나만 흔들려도 재발한다.
#   그래서 "우리 코드가 바뀔 때"가 아니라 "매일" 확인하는 것이 맞다.
#
# 왜 IndexNow 는 자동이 아닌가:
#   외부(검색엔진)로 나가는 호출은 사람 판단 없이 반복 발신하지 않는다는 원칙.
#   Actions 탭에서 "Run workflow" 한 번으로 돌릴 수 있게만 해 둔다.
#
# 이 저장소는 public 이라 Actions 사용료 $0.

name: SEO guard

on:
  # 머지 «앞»으로 온 게이트. 종전에는 스케줄뿐이라 위반이 프로드에 배포된 뒤
  # 최대 24시간 사용자 화면에 남았다(2026-09-02: /product 에 떠난 사람의 전화번호).
  pull_request:
  schedule:
    # 매일 09:00 KST (= 00:00 UTC). 아침에 결과가 나와 있도록.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      submit_indexnow:
        description: 'IndexNow 재제출까지 함께 실행 (검색엔진에 재크롤 통지)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  healthcheck:
    name: 불변식 실측 (prod)
    # PR 에서는 프로드가 아니라 «그 PR 의 프리뷰»를 재야 한다 — 아래 preview 잡이 한다.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 의존성 설치 불필요 — 스크립트는 Node 내장 fetch 만 쓴다.
      - name: SEO 불변식 헬스체크
        run: node scripts/seo-healthcheck.mjs
        env:
          BASE: https://dailyfitai.app
          # 표본을 넉넉히 — 활동 상세는 10,000장 규모라 5건이면 얇다.
          SEO_SAMPLE: '12'

      - name: IndexNow 재제출 (수동 실행 시에만)
        if: github.event_name == 'workflow_dispatch' && inputs.submit_indexnow
        run: node scripts/indexnow.mjs

  preview:
    name: 불변식 실측 (PR 프리뷰)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 🔴 **막는 게이트다.** 2026-09-02 에 「경고만」으로 켜고 일주일 지켜본 뒤
    #    2026-09-09 에 전환했다 — 영우 승인 조건이 「며칠 보고 헛빨간불 없으면
    #    막게 바꾼다」였고, 실측이 조건을 채웠다:
    #      · PR 프리뷰 6회(그중 5회가 사이트 전면 개편 브랜치) — 전부 «측정하고» 통과
    #      · 매일 프로드 8회 — 전부 통과
    #      · 헛빨간불 0건
    #    스텝 단위로 확인했다(`SEO 불변식 헬스체크 (프리뷰)=success`) — 건너뛴 게
    #    아니라 실제로 돌았다. `continue-on-error` 를 켜 두면 잡이 초록이라
    #    런 결과만 보고는 이걸 알 수 없다.
    permissions:
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Netlify 는 «head SHA» 에 커밋 상태로 프리뷰 URL 을 붙인다.
      # pull_request 이벤트의 github.sha 는 머지 커밋이라 여기선 쓰면 안 된다.
      - name: Netlify 프리뷰 URL 기다리기
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          url=""
          for i in $(seq 1 40); do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status" \
              --jq '.statuses[] | select(.context=="netlify/dailyfit-beta/deploy-preview") | .state' 2>/dev/null | head -1 || true)
            url=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status" \
              --jq '.statuses[] | select(.context=="netlify/dailyfit-beta/deploy-preview") | .target_url' 2>/dev/null | head -1 || true)
            echo "t=$((i*15))s state=${state:-none}"
            if [ "${state:-}" = "success" ] && [ -n "${url:-}" ]; then
              echo "url=$url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "${state:-}" = "failure" ] || [ "${state:-}" = "error" ]; then
              # 프리뷰 «빌드»가 깨진 경우는 Netlify 자체 체크가 이미 이 PR 을 빨간불로
              # 만든다. 여기서 또 실패시키면 같은 사고를 두 번 보고하는 소음이 된다.
              echo "::warning::프리뷰 빌드가 실패했다 — Netlify 체크를 먼저 보라. 이 PR 은 검사하지 못한다"
              exit 0
            fi
            sleep 15
          done
          # 🔴 여기 도달 = 10분 동안 프리뷰가 안 떴다. 이건 «위반 0건»이 아니라
          #    «못 쟀다»이므로 통과시키지 않는다. 막는 게이트로 바꾸면서 이 구멍을
          #    같이 닫았다 — 안 닫으면 프리뷰가 늦는 PR 이 검사를 건너뛴 채 초록이 되어
          #    「막는 가드」가 시늉이 된다.
          echo "::error::프리뷰 URL 을 10분 안에 못 받았다 — 검사하지 못했다(0건이 아니라 «측정 실패»)."
          echo "재실행하거나, Netlify 프리뷰가 왜 안 뜨는지 먼저 보라."
          exit 1

      # 여기까지 왔다면 URL 이 있다(없으면 위 스텝이 이미 실패했다). 빈 값 가드는
      # 프리뷰 «빌드» 실패로 exit 0 한 경로 하나만 남는다.
      - name: SEO 불변식 헬스체크 (프리뷰)
        if: steps.preview.outputs.url != ''
        run: node scripts/seo-healthcheck.mjs
        env:
          # BASE = 어디로 요청하나 · SEO_SITE_URL = 정본이 어디여야 하나(프로드 고정)
          BASE: ${{ steps.preview.outputs.url }}
          SEO_SITE_URL: https://dailyfitai.app
          SEO_SAMPLE: '6'
